<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penugasan Three.js Kreatif</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0a16;
        }
        canvas {
            display: block;
        }
    </style>

    <!-- This script tells the browser where to fetch Three.js assets without installation -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com",
          "three/addons/": "https://unpkg.com"
        }
      }
    </script>
</head>
<body>

    <!-- We load our logic as a module -->
    <script type="module" src="main.js"></script>

</body>
</html>
